# S01 smoke_tiny (scenarios.md): 3 cabs, 10 employees, 1 hour.
# The CI scenario - it must stay small and fast.
name: smoke_tiny
version: 1
seed: 42
start: "2026-10-05T00:30:00Z"      # 06:00 IST
duration_hours: 1
speed_factor: 60
routing: approx                    # ADR-0010 rule 6: never the public OSM servers

operator:
  config_overrides:
    alert_wait_minutes: 20
    # S01 is one hour long, so an unassigned request must be able to reach a terminal
    # state inside it. The product default is 120 minutes, which would leave every
    # request still queued when the run ends.
    request_expiry_minutes: 30

modes:
  - {mode: manual}

fleet:
  - {type: sedan_4, count: 2, depot: [28.5355, 77.3910]}
  - {type: suv_6, count: 1, depot: [28.5355, 77.3910]}

drivers:
  shift_start_ist: "06:00"
  shift_end_ist: "22:00"
  late_start_p: 0.0

clients:
  - name: Client A
    office:
      name: B200
      location: [28.5703, 77.3218]
    employees:
      count: 10
      home_zones: [sector_135, sector_168]
      vip_share: 0.0
      priority_dist: {5: 1.0}
      shifts:
        # Chosen so the to_office demand lands inside the one-hour window: requests go
        # in at shift_start - Normal(45, 10) min, around 06:05 IST here. Early in the
        # window on purpose: a rider needs time to be assigned, collected and dropped
        # before the hour is up, or the run can never show a completed ride.
        - {start_ist: "06:50", end_ist: "15:50", share: 1.0}

supervisor:
  policy: manual_nearest
  reaction_delay_s: [20, 120]

traffic:
  profile: ncr_default

assertions:
  all_requests_terminal: true
  invalid_transitions: 0
  api_5xx_max: 0
