# Staging / production deployment on one Linux VM (task R01).
#
# `non-functional.md` (Portability): everything runs with Docker Compose on a 4 vCPU /
# 8 GB box while the public OSM servers are used, 8 vCPU / 16 GB once the NCR extract is
# self-hosted (task I02b, `docker-compose.maps.yml`).
#
# This file is **standalone** - it does not extend `docker-compose.yml`. The development
# compose publishes Postgres, Redis and the broker on the host so a developer can reach
# them; here only Caddy is on the host network, and everything else talks over the
# private compose network. Merging the two would have inherited those published ports
# and put the database on the public internet, which is the kind of inheritance that
# only shows up in a scan.
#
# Start:  make staging-up    (reads infra/.env.staging)
# Stop:   make staging-down
# Runbook, including first-boot and restore: docs/05-engineering/deployment.md

name: smartcab-staging

x-backend: &backend
  build:
    context: ../backend
    dockerfile: Dockerfile
  image: smartcab-backend:${IMAGE_TAG:-local}
  restart: unless-stopped
  env_file: [.env.staging]
  environment:
    # Container-to-container addresses, overriding whatever .env.staging says for a
    # developer's localhost. Service names, not IPs: compose resolves them.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    MQTT_HOST: mosquitto
    MQTT_PORT: "1883"
    # What a driver's phone is told, which is not the above: the API reaches the broker
    # by service name on the private network, the phone reaches it across the internet.
    # The host must be SITE_ADDRESS - that is the SAN on the broker's certificate, so a
    # separate `mqtt.` hostname would fail validation on every phone.
    MQTT_PUBLIC_HOST: ${SITE_ADDRESS}
    MQTT_PUBLIC_PORT: "8883"
    MQTT_PUBLIC_TLS: "true"
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  networks: [internal]

services:
  # --- data ------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: smartcab-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # No published port. The only things that may reach the database are on `internal`.
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: smartcab-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartcab-staging-mosquitto
    restart: unless-stopped
    ports:
      # 8883 only. Driver phones connect from the public internet, so the plaintext
      # 1883 listener that development uses is not published here - it exists inside
      # the compose network for the ingestor, which never leaves the box.
      #
      # The host port is configurable because 8883 is not always free - Windows reserves
      # it on some machines - and because a VM may front the broker differently. The
      # container port never moves: the ACLs, the app and mqtt-topics.md all name 8883.
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./mosquitto/staging:/mosquitto/config:ro
      # The per-vehicle password and ACL files the backend generates (B11).
      - mosquitto-generated:/mosquitto/generated
      - mqtt-certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    depends_on:
      mqtt-certs: {condition: service_completed_successfully}
      broker-seed: {condition: service_completed_successfully}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t 'sc/v1/#' -E -i healthcheck -u ${MQTT_INGESTOR_USER} -P ${MQTT_INGESTOR_PASSWORD} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Mosquitto serves MQTTS with the certificate Caddy already obtained and renews,
  # rather than obtaining a second one for the same hostname. It cannot read Caddy's
  # data volume directly: Caddy writes the key 0600 as root and Mosquitto runs as
  # uid 1883, so a read-only mount of that volume fails at startup with a bare
  # "Unable to load server key file" and no hint why. This copies the pair into a
  # volume of its own and makes it readable by that user.
  #
  # **It waits for Caddy rather than racing it.** On a clean box there is no certificate
  # when the stack first comes up - Caddy has to finish its ACME challenge first - so a
  # one-shot copy exits 1 and, because Mosquitto waits on this service completing,
  # takes the whole first `make staging-up` down with it. That is what happened the
  # first time this was run end to end. Caddy is starting in parallel, so polling for
  # the file is all that is needed.
  #
  # Re-run it after each renewal (Caddy renews ~30 days out):
  #     docker compose -f infra/docker-compose.staging.yml up mqtt-certs
  #     docker compose -f infra/docker-compose.staging.yml restart mosquitto
  # `make staging-mqtt-cert` does both.
  mqtt-certs:
    image: alpine:3.20
    container_name: smartcab-staging-mqtt-certs
    restart: "no"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - caddy-data:/caddy:ro
      - mqtt-certs:/certs
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        pattern="*certificates*/$${SITE_ADDRESS}/$${SITE_ADDRESS}.crt"
        waited=0
        until src="$$(find /caddy -path "$$pattern" 2>/dev/null | head -n1)"; [ -n "$$src" ]; do
          if [ "$$waited" -ge "$${CERT_WAIT_SECONDS:-300}" ]; then
            echo "no certificate for $${SITE_ADDRESS} after $${waited}s."
            echo "check 'docker compose logs caddy': the usual cause is that"
            echo "$${SITE_ADDRESS} does not resolve to this host yet, so the ACME"
            echo "challenge cannot complete."
            exit 1
          fi
          [ "$$waited" -eq 0 ] && echo "waiting for caddy to obtain a certificate for $${SITE_ADDRESS}..."
          sleep 5
          waited=$$((waited + 5))
        done
        cp "$$src" /certs/server.crt
        cp "$${src%.crt}.key" /certs/server.key
        chown 1883:1883 /certs/server.crt /certs/server.key
        chmod 0640 /certs/server.crt /certs/server.key
        echo "certificate for $${SITE_ADDRESS} published to the broker (waited $${waited}s)"
    networks: [internal]

  # The generated credentials are written by the backend and read by the broker, and
  # those are two different users in two different images: the backend runs as uid 10001
  # (it must not be root - a GPS ingestor parsing payloads from the internet is exactly
  # the process that should not be able to write its own code) and Mosquitto runs as
  # 1883. A fresh named volume is owned by root, so the first write simply fails with
  # EACCES.
  #
  # This sets the directory to 10001:1883 and **setgid** (2770): the backend owns it and
  # can write, and every file created inside inherits group 1883, so 0640 is readable by
  # the broker without anything being world-readable or either container being root.
  broker-files-init:
    image: alpine:3.20
    container_name: smartcab-staging-broker-files-init
    restart: "no"
    volumes:
      - mosquitto-generated:/generated
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        chown 10001:1883 /generated
        chmod 2770 /generated
        echo "credential volume ready: $$(stat -c '%u:%g %a' /generated)"
    networks: [internal]

  # Mosquitto runs with `allow_anonymous false`, so it cannot start at all until its
  # `password_file` exists - and on a clean deployment there are no vehicles, so nothing
  # would ever create it. B11 renders the file contents and deliberately leaves the
  # filesystem to deployment, which left `DutyService.broker_files` with no caller
  # anywhere; the broker simply never came up. These two services are that caller.
  #
  # The seed runs once, before the broker, so the files exist for it to open. It needs
  # the schema, so it waits for the migration.
  broker-seed:
    <<: *backend
    container_name: smartcab-staging-broker-seed
    restart: "no"
    command: ["python", "-m", "app.broker_sync", "once"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MQTT_GENERATED_DIR: /mosquitto/generated
    volumes:
      - mosquitto-generated:/mosquitto/generated
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      broker-files-init: {condition: service_completed_successfully}
    healthcheck:
      disable: true

  # Then this one runs beside the broker and rewrites the files whenever a driver goes
  # on or off duty, sending SIGHUP so Mosquitto reloads them. Without it a credential
  # issued at duty start would be one the broker has never heard of, and the driver's
  # app would be refused with no explanation anywhere.
  #
  # `pid: service:mosquitto` is what lets it signal PID 1. The alternative - mounting
  # the Docker socket - is a far larger grant for a far smaller job: anything that can
  # talk to the socket can start a privileged container.
  broker-sync:
    <<: *backend
    container_name: smartcab-staging-broker-sync
    command: ["python", "-m", "app.broker_sync", "loop"]
    pid: "service:mosquitto"
    # As the broker's own user, for two reasons at once. Signalling: sharing the PID
    # namespace is not enough - a process running as uid 10001 cannot send SIGHUP to one
    # owned by 1883, and the reload was refused with EPERM every cycle. Writing: the
    # credentials directory is setgid 1883 and group-writable, so this user can still
    # create the files.
    user: "1883:1883"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MQTT_GENERATED_DIR: /mosquitto/generated
      BROKER_SYNC_INTERVAL_SECONDS: "15"
    volumes:
      - mosquitto-generated:/mosquitto/generated
    depends_on:
      postgres: {condition: service_healthy}
      mosquitto: {condition: service_started}
      broker-files-init: {condition: service_completed_successfully}

  # --- application -------------------------------------------------------------
  migrate:
    <<: *backend
    container_name: smartcab-staging-migrate
    restart: "no"
    # Runs to completion before the API starts. A deploy that applies migrations from
    # the API's own entrypoint races itself the moment there are two API containers.
    command: ["python", "-m", "alembic", "upgrade", "head"]
    healthcheck:
      disable: true

  api:
    <<: *backend
    container_name: smartcab-staging-api
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      # `ready`, not `live`: a container that cannot reach its database should not be
      # in rotation. A degraded result (Redis, broker or OSRM down) still returns 200
      # by design - see `app/main.py`.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingestor:
    <<: *backend
    container_name: smartcab-staging-ingestor
    command: ["python", "-m", "app.ingestor"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # Its own metrics port: it has no HTTP server of its own, so without this
      # Prometheus cannot see the GPS counters at all.
      METRICS_PORT: "9101"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mosquitto: {condition: service_started}
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *backend
    container_name: smartcab-staging-worker
    # `--pool=threads`, not the default prefork: the metrics server started by the
    # `worker_ready` signal runs in the main process, and a forked child's counters
    # would never reach it. The three sweeps are I/O-bound and take milliseconds.
    command:
      - "python"
      - "-m"
      - "celery"
      - "-A"
      - "app.workers.celery_app"
      - "worker"
      - "--pool=threads"
      - "--concurrency=4"
      - "--loglevel=info"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      METRICS_PORT: "9102"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *backend
    container_name: smartcab-staging-beat
    # Exactly one beat, ever. Two schedulers means every sweep runs twice, which for
    # the expiry sweep means two "your cab is nearly due" pushes to the same rider.
    deploy:
      replicas: 1
    command:
      - "python"
      - "-m"
      - "celery"
      - "-A"
      - "app.workers.celery_app"
      - "beat"
      - "--loglevel=info"
    depends_on:
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # --- edge ----------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: smartcab-staging-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      MONITORING_ADDRESS: ${MONITORING_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Also mounted read-only into Mosquitto, which serves
      # MQTTS with the same certificate rather than obtaining a second one.
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [internal]

  # --- observability ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smartcab-staging-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 30 days: long enough to compare this week's waits with last month's, short
      # enough to fit the pilot VM's disk.
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    # Not published. Reached through Caddy on the monitoring hostname, or over an SSH
    # tunnel. An unauthenticated Prometheus on the public internet is an inventory of
    # the deployment, free of charge.
    networks: [internal]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: smartcab-staging-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${MONITORING_ADDRESS}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [internal]

  loki:
    image: grafana/loki:3.2.1
    container_name: smartcab-staging-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks: [internal]

  promtail:
    image: grafana/promtail:3.2.1
    container_name: smartcab-staging-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      # Reads the containers' JSON log files, and the docker socket for the labels
      # (container name, compose service) that make them searchable. Read-only: this
      # container must not be able to start anything.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [internal]

  # --- backups ----------------------------------------------------------------------
  backup:
    image: postgis/postgis:16-3.4
    container_name: smartcab-staging-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # non-functional.md: daily backups, 14-day retention, restore tested monthly.
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "86400"
    entrypoint: ["/bin/bash", "/opt/backup/backup.sh", "loop"]
    volumes:
      - ./scripts/backup.sh:/opt/backup/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
  mosquitto-log:
  mosquitto-generated:
  mqtt-certs:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  loki-data:
  backups:
