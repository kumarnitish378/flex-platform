# Mosquitto 2 — staging / production (task R01, mqtt-topics.md "Access control").
#
# Two differences from the development config, and both matter:
#
# 1. **Anonymous access is off.** Development allows it so `make up` works before the
#    backend can issue credentials; here every client authenticates, and the ACL is the
#    generated per-vehicle file from B11 - a driver may publish only to their own
#    vehicle's topic.
# 2. **TLS on 8883 is the only published listener.** Driver phones connect across the
#    public internet, and a GPS track plus a vehicle id in plaintext is a live feed of
#    where a named person is. The plaintext 1883 listener still exists but is bound
#    inside the compose network for the ingestor, which never leaves the box.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

allow_anonymous false
# Both generated by the backend from the vehicle registry (B11) into a shared volume.
# Never hand-edited: the next duty start rewrites them.
password_file /mosquitto/generated/passwd
acl_file /mosquitto/generated/acl

message_size_limit 262144

# A client that goes quiet is holding a session; drivers drop in and out of coverage all
# day, so the keepalive has to tolerate that without churning sessions.
max_keepalive 120

# --- public listener: TLS only ----------------------------------------------
listener 8883 0.0.0.0
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# TLS 1.2 is the floor: Android 8 (the oldest phone `non-functional.md` supports) has
# it, and everything below it is broken.
tls_version tlsv1.2
# No client certificates. Vehicles authenticate with the per-device username and
# password issued at duty start, not with a PKI nobody will operate.
require_certificate false

# --- internal listener: the ingestor ----------------------------------------
# Not published to the host (see docker-compose.staging.yml). The ingestor is on the
# same compose network and still authenticates, so a container compromise does not get
# the whole topic tree for free.
listener 1883 0.0.0.0
protocol mqtt
