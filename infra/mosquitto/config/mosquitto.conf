# Mosquitto 2 — development configuration (task I01).
# TLS on 8883 is added for staging/prod only (mqtt-topics.md).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Development listener ---------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# Authentication.
#
# Dev default is anonymous so `make up` works before the backend can issue
# credentials (per-vehicle credentials arrive with task B11).
#
# To rehearse the real setup, set allow_anonymous false and point at the files
# below; the backend generates both from the vehicle registry in B11.
allow_anonymous true
# password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Payloads are small JSON pings; 256 KB is far above the 500-ping batch cap.
message_size_limit 262144
