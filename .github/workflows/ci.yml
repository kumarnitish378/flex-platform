name: CI

on:
  push:
    branches: [main, 'dev/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ADR-0010: CI must never call the public OSM servers. Everything routes through
  # the network-free "approx" provider.
  ROUTING_PROVIDER: approx
  GEOCODING_PROVIDER: none
  OSM_USER_AGENT: flex-platform-ci
  OSM_CONTACT_EMAIL: ci@example.invalid

jobs:
  # Detects which parts of the monorepo exist yet, so jobs for parts that are not built
  # pass as explicit no-ops instead of failing or being silently absent.
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      app: ${{ steps.check.outputs.app }}
      simulator: ${{ steps.check.outputs.simulator }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          test -f backend/pyproject.toml   && echo "backend=true"   >> "$GITHUB_OUTPUT" || echo "backend=false"   >> "$GITHUB_OUTPUT"
          test -f app/pubspec.yaml         && echo "app=true"       >> "$GITHUB_OUTPUT" || echo "app=false"       >> "$GITHUB_OUTPUT"
          test -f simulator/pyproject.toml && echo "simulator=true" >> "$GITHUB_OUTPUT" || echo "simulator=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend-lint:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.backend != 'true'
        run: echo "backend/ does not exist yet (task B01) - nothing to lint."
      - if: needs.detect.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: needs.detect.outputs.backend == 'true'
        run: pip install -e './backend[dev]'
      - if: needs.detect.outputs.backend == 'true'
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy .

  backend-test:
    needs: detect
    runs-on: ubuntu-latest
    # Integration tests need real PostGIS (testing-strategy.md section 1). Without this
    # they skip, and tenant-isolation regressions would reach main unnoticed.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smartcab
          POSTGRES_USER: smartcab
          POSTGRES_PASSWORD: smartcab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://smartcab:smartcab@localhost:5432/smartcab
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.backend != 'true'
        run: echo "backend/ does not exist yet (task B01) - nothing to test."
      - if: needs.detect.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: needs.detect.outputs.backend == 'true'
        run: pip install -e './backend[dev]'
      - if: needs.detect.outputs.backend == 'true'
        working-directory: backend
        run: pytest -q
      # A skipped integration suite in CI looks green but proves nothing, so assert the
      # database tests really ran.
      - if: needs.detect.outputs.backend == 'true'
        working-directory: backend
        run: pytest tests/integration -q --no-header -rs | tee /tmp/integration.txt
      - if: needs.detect.outputs.backend == 'true'
        run: |
          if grep -qi "no PostgreSQL reachable" /tmp/integration.txt; then
            echo "::error::Integration tests skipped in CI - the postgres service is not reachable."
            exit 1
          fi
      # B08 acceptance: the state machines stay fully covered, branches included.
      - if: needs.detect.outputs.backend == 'true'
        working-directory: backend
        run: |
          test -f app/domain/state_machines.py || exit 0
          pytest tests/unit/test_state_machines.py -q             --cov=app.domain.state_machines --cov-branch --cov-fail-under=100

  # Installs the backend WITHOUT dev extras and imports it, so a runtime dependency
  # that is only declared under [dev] - or not declared at all - fails here rather than
  # in production. This job exists because both mistakes shipped once.
  backend-packaging:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.backend != 'true'
        run: echo "backend/ does not exist yet (task B01) - nothing to install."
      - if: needs.detect.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: needs.detect.outputs.backend == 'true'
        run: pip install ./backend
      - if: needs.detect.outputs.backend == 'true'
        run: |
          python -c "
          # Import the models too: create_app alone does not pull them in, which is how
          # an undeclared geoalchemy2 slipped past this guard once already.
          import app.models
          from app.main import create_app
          from app.core.settings import Settings
          create_app(Settings(database_url='postgresql+asyncpg://a:b@localhost:5432/c'))
          print('production install imports cleanly')
          "

  app-analyze:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.app != 'true'
        run: echo "app/ has no pubspec.yaml yet (task A01) - nothing to analyze."
      - if: needs.detect.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: needs.detect.outputs.app == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter analyze

  app-test:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.app != 'true'
        run: echo "app/ has no pubspec.yaml yet (task A01) - nothing to test."
      - if: needs.detect.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: needs.detect.outputs.app == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter test

  sim-quick:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.simulator != 'true'
        run: echo "simulator/ does not exist yet (task M01) - nothing to run."
      - if: needs.detect.outputs.simulator == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: needs.detect.outputs.simulator == 'true'
        run: pip install -e './simulator[dev]'
      - if: needs.detect.outputs.simulator == 'true'
        working-directory: simulator
        run: |
          pytest -q
          python -m sim suite quick

  # Repository-wide guard rails from CLAUDE.md that are cheap to check on every PR.
  policy-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hard-coded map service URLs outside config and docs
        shell: bash
        run: |
          # ADR-0010 rule 1: URLs come from env config only.
          # Tests are excluded on purpose: a test proving a public URL is refused must
          # name it. See backend/tests/unit/test_no_hardcoded_map_urls.py
          if grep -rInE 'https?://(router\.project-osrm\.org|tile\.openstreetmap\.org|nominatim\.openstreetmap\.org)' \
               --include='*.py' --include='*.dart' --include='*.yml' --include='*.yaml' \
               --exclude-dir=docs --exclude-dir=tests \
               --exclude='settings.py' \
               backend/app simulator/sim app infra 2>/dev/null; then
            echo "::error::Hard-coded public OSM URL found. Read it from config instead (ADR-0010 rule 1)."
            exit 1
          fi
          echo "OK: no hard-coded public OSM URLs in code."
      - name: No committed .env
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is committed. Secrets must stay out of the repo (CLAUDE.md rule 10)."
            exit 1
          fi
          echo "OK: .env is not tracked."
