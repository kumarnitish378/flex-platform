name: CI

on:
  push:
    branches: [main, 'dev/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ADR-0010: CI must never call the public OSM servers. Everything routes through
  # the network-free "approx" provider.
  ROUTING_PROVIDER: approx
  GEOCODING_PROVIDER: none
  OSM_USER_AGENT: flex-platform-ci
  OSM_CONTACT_EMAIL: ci@example.invalid

jobs:
  # Detects which parts of the monorepo exist yet, so jobs for parts that are not built
  # pass as explicit no-ops instead of failing or being silently absent.
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      app: ${{ steps.check.outputs.app }}
      simulator: ${{ steps.check.outputs.simulator }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          test -f backend/pyproject.toml   && echo "backend=true"   >> "$GITHUB_OUTPUT" || echo "backend=false"   >> "$GITHUB_OUTPUT"
          test -f app/pubspec.yaml         && echo "app=true"       >> "$GITHUB_OUTPUT" || echo "app=false"       >> "$GITHUB_OUTPUT"
          test -f simulator/pyproject.toml && echo "simulator=true" >> "$GITHUB_OUTPUT" || echo "simulator=false" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  backend-lint:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.backend != 'true'
        run: echo "backend/ does not exist yet (task B01) - nothing to lint."
      - if: needs.detect.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: needs.detect.outputs.backend == 'true'
        run: pip install -e './backend[dev]'
      - if: needs.detect.outputs.backend == 'true'
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy .

  backend-test:
    needs: detect
    runs-on: ubuntu-latest
    # Integration tests need real PostGIS (testing-strategy.md section 1). Without this
    # they skip, and tenant-isolation regressions would reach main unnoticed.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smartcab
          POSTGRES_USER: smartcab
          POSTGRES_PASSWORD: smartcab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://smartcab:smartcab@localhost:5432/smartcab
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.backend != 'true'
        run: echo "backend/ does not exist yet (task B01) - nothing to test."
      - if: needs.detect.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: needs.detect.outputs.backend == 'true'
        run: pip install -e './backend[dev]'
      - if: needs.detect.outputs.backend == 'true'
        working-directory: backend
        run: pytest -q
      # A skipped integration suite in CI looks green but proves nothing, so assert the
      # database tests really ran.
      - if: needs.detect.outputs.backend == 'true'
        working-directory: backend
        run: pytest tests/integration -q --no-header -rs | tee /tmp/integration.txt
      - if: needs.detect.outputs.backend == 'true'
        run: |
          if grep -qi "no PostgreSQL reachable" /tmp/integration.txt; then
            echo "::error::Integration tests skipped in CI - the postgres service is not reachable."
            exit 1
          fi
      # B08 acceptance: the state machines stay fully covered, branches included.
      - if: needs.detect.outputs.backend == 'true'
        working-directory: backend
        run: |
          test -f app/domain/state_machines.py || exit 0
          pytest tests/unit/test_state_machines.py -q             --cov=app.domain.state_machines --cov-branch --cov-fail-under=100

  # Installs the backend WITHOUT dev extras and imports it, so a runtime dependency
  # that is only declared under [dev] - or not declared at all - fails here rather than
  # in production. This job exists because both mistakes shipped once.
  backend-packaging:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.backend != 'true'
        run: echo "backend/ does not exist yet (task B01) - nothing to install."
      - if: needs.detect.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: needs.detect.outputs.backend == 'true'
        run: pip install ./backend
      - if: needs.detect.outputs.backend == 'true'
        run: |
          python -c "
          # Import the models too: create_app alone does not pull them in, which is how
          # an undeclared geoalchemy2 slipped past this guard once already.
          import app.models
          from app.main import create_app
          from app.core.settings import Settings
          create_app(Settings(database_url='postgresql+asyncpg://a:b@localhost:5432/c'))
          print('production install imports cleanly')
          "

  # The staging deployment is code too (task R01). A Dockerfile that no longer builds,
  # or a compose file with a typo in it, is discovered at the worst possible moment -
  # when somebody is deploying. Both are cheap to check on every push.
  deployment:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.backend != 'true'
        run: echo "backend/ does not exist yet (task B01) - nothing to build."

      - if: needs.detect.outputs.backend == 'true'
        name: The deployment image builds
        run: docker build -t smartcab-backend:ci backend/

      - if: needs.detect.outputs.backend == 'true'
        name: Every entrypoint the staging compose uses actually starts
        shell: bash
        run: |
          # `--help` on each one: it loads the module graph without needing a database,
          # which is what catches an entrypoint renamed out from under the compose file.
          set -euo pipefail
          for module in app.ingestor app.workers.celery_app; do
            docker run --rm smartcab-backend:ci python -c "import $module" \
              && echo "OK: $module imports"
          done
          docker run --rm smartcab-backend:ci python -m alembic --help >/dev/null \
            && echo "OK: alembic is available for the migrate container"

      - name: The compose files parse
        shell: bash
        run: |
          set -euo pipefail
          # docker compose refuses to read a file with unset variables, so the staging
          # config is validated against the committed template rather than real secrets.
          # Placeholders only - nothing here is or resembles a credential.
          sed -e 's/^JWT_SECRET=$/JWT_SECRET=ci-placeholder-0123456789abcdef0123456789/' \
              -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-placeholder/' \
              -e 's/^MQTT_INGESTOR_PASSWORD=$/MQTT_INGESTOR_PASSWORD=ci-placeholder/' \
              -e 's/^GRAFANA_ADMIN_PASSWORD=$/GRAFANA_ADMIN_PASSWORD=ci-placeholder/' \
              -e 's/^OSM_CONTACT_EMAIL=$/OSM_CONTACT_EMAIL=ci@example.invalid/' \
              infra/.env.staging.example > infra/.env.staging

          docker compose -f infra/docker-compose.yml config >/dev/null
          echo "OK: development compose"

          docker compose -f infra/docker-compose.staging.yml \
            --env-file infra/.env.staging config >/dev/null
          echo "OK: staging compose"

          docker compose -f infra/docker-compose.yml \
            -f infra/docker-compose.maps.yml config >/dev/null
          echo "OK: optional self-hosted maps overlay"

          rm -f infra/.env.staging

      - name: Shell scripts parse
        shell: bash
        run: |
          set -euo pipefail
          for script in infra/scripts/*.sh scripts/*.sh; do
            bash -n "$script" && echo "OK: $script"
          done

      - name: Provisioned dashboards and configs are valid JSON
        shell: bash
        run: |
          set -euo pipefail
          for file in infra/grafana/dashboards/*.json infra/tiles/config.json                       infra/tiles/styles/*/style.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$file"               && echo "OK: $file"
          done
          # Whether each panel queries a metric that exists, whether any metric is
          # unread, and whether two panels overlap are all checked by
          # backend/tests/unit/test_dashboards_match_the_metrics.py, which runs in
          # backend-test and in `make test`.

  app-analyze:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.app != 'true'
        run: echo "app/ has no pubspec.yaml yet (task A01) - nothing to analyze."
      - if: needs.detect.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: needs.detect.outputs.app == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter analyze

  app-test:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.app != 'true'
        run: echo "app/ has no pubspec.yaml yet (task A01) - nothing to test."
      - if: needs.detect.outputs.app == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - if: needs.detect.outputs.app == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter test

  # S01 against a live backend. Running it offline would be cheaper and would prove
  # nothing: the assertions that matter (every request terminal, no invalid transitions,
  # no 5xx) can only be evaluated when there is a platform to evaluate them against, and
  # an offline run says "assertions not checked" precisely so it cannot look like a pass.
  sim-quick:
    needs: detect
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smartcab
          POSTGRES_USER: smartcab
          POSTGRES_PASSWORD: smartcab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://smartcab:smartcab@localhost:5432/smartcab
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - if: needs.detect.outputs.simulator != 'true'
        run: echo "simulator/ does not exist yet (task M01) - nothing to run."
      - if: needs.detect.outputs.simulator == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - if: needs.detect.outputs.simulator == 'true'
        run: pip install -e './simulator[dev]' -e './backend[dev]'
      - if: needs.detect.outputs.simulator == 'true'
        working-directory: simulator
        run: pytest -q
      - if: needs.detect.outputs.simulator == 'true'
        run: scripts/live_stack.sh up
      - if: needs.detect.outputs.simulator == 'true'
        working-directory: simulator
        run: python -m sim suite quick --platform http://localhost:8000/api/v1
      - if: always() && needs.detect.outputs.simulator == 'true'
        run: scripts/live_stack.sh down
      - if: failure() && needs.detect.outputs.simulator == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sim-quick-diagnostics
          path: |
            /tmp/live-stack/*.log
            simulator/runs/
          retention-days: 7

  # Repository-wide guard rails from CLAUDE.md that are cheap to check on every PR.
  policy-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No hard-coded map service URLs outside config and docs
        shell: bash
        run: |
          # ADR-0010 rule 1: URLs come from env config only.
          # Tests are excluded on purpose: a test proving a public URL is refused must
          # name it. See backend/tests/unit/test_no_hardcoded_map_urls.py
          if grep -rInE 'https?://(router\.project-osrm\.org|tile\.openstreetmap\.org|nominatim\.openstreetmap\.org)' \
               --include='*.py' --include='*.dart' --include='*.yml' --include='*.yaml' \
               --exclude-dir=docs --exclude-dir=tests \
               --exclude='settings.py' \
               backend/app simulator/sim app infra 2>/dev/null; then
            echo "::error::Hard-coded public OSM URL found. Read it from config instead (ADR-0010 rule 1)."
            exit 1
          fi
          echo "OK: no hard-coded public OSM URLs in code."
      - name: No committed .env
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is committed. Secrets must stay out of the repo (CLAUDE.md rule 10)."
            exit 1
          fi
          echo "OK: .env is not tracked."
